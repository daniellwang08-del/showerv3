name: Deploy to Development

on:
  push:
    branches:
      - dev-branch

concurrency:
  group: development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Pass token so the VPS can fetch a private HTTPS remote without prompts.
          envs: GITHUB_TOKEN

          script: |
            set -e

            cd /opt/showerv3-dev

            echo "Pulling latest code..."
            # Repo remote is HTTPS with no stored credentials; authenticate via Actions token.
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/daniellwang08-del/showerv3.git"
            git fetch --force "$REPO_URL" "+refs/heads/dev-branch:refs/remotes/origin/dev-branch"
            git reset --hard origin/dev-branch

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Installing Python dependencies..."
            pip install -r requirements.txt

            echo "Running database migrations..."
            alembic upgrade head

            echo "Building frontend..."
            cd frontend
            npm install
            npm run build
            cd ..

            echo "Restarting API..."
            systemctl restart showerv3-dev-api

            echo "Restarting workers..."
            systemctl restart showerv3-dev-worker@extraction
            systemctl restart showerv3-dev-worker@analysis
            systemctl restart showerv3-dev-worker@tailoring
            systemctl restart showerv3-dev-worker@save
            systemctl restart showerv3-dev-worker@resume
            systemctl restart showerv3-dev-worker@autopost
            systemctl restart showerv3-dev-worker@scraper

            echo "Waiting for startup..."
            sleep 10

            echo "Health check..."
            curl --fail https://dev.robertstaff.com/api/v1/health

            echo "Dev deployment successful."
