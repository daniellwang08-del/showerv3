name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Default is 10m; pip + npm + vite on the CPX21 often exceeds that.
          command_timeout: 30m

          script: |
            set -e

            cd /opt/showerv3

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Installing Python dependencies..."
            pip install -r requirements.txt

            echo "Running database migrations..."
            alembic upgrade head

            echo "Building frontend..."
            cd frontend
            npm install
            npm run build
            cd ..

            echo "Restarting API..."
            systemctl restart showerv3-api

            echo "Restarting workers..."
            systemctl restart showerv3-worker@extraction
            systemctl restart showerv3-worker@analysis
            systemctl restart showerv3-worker@tailoring
            systemctl restart showerv3-worker@save
            systemctl restart showerv3-worker@resume

            echo "Waiting for in-flight scrapes before restarting scraper worker..."
            # Rolling restart mid-crawl cancels run_scraper_task and showed a false
            # "Cancelled or timed out" banner even when scrape_runs already succeeded.
            # NOTE: heredoc body must stay indented at the script block's minimum
            # indent so YAML does not end `script: |` early (GitHub Actions parse error).
            # Closing PY must use that same minimum indent so bash sees it at column 0
            # after YAML strips the common leading whitespace.
            DBURL=$(grep -E '^DATABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            DBURL=$(echo "$DBURL" | sed 's/postgresql+asyncpg/postgresql/' | sed 's/+asyncpg//')
            for i in $(seq 1 120); do
              running=$(DBURL="$DBURL" python - <<'PY'
            from sqlalchemy import create_engine, text
            import os
            url = os.environ["DBURL"]
            try:
                e = create_engine(url)
                with e.connect() as c:
                    n = c.execute(text("SELECT count(*) FROM scrape_runs WHERE status = 'running'")).scalar() or 0
                print(int(n))
            except Exception:
                print(0)
            PY
              )
              if [ "$running" = "0" ]; then
                echo "No running scrape_runs — safe to restart scraper."
                break
              fi
              echo "  $running scrape_run(s) still running; waiting (attempt $i/120)..."
              sleep 5
            done

            systemctl restart showerv3-worker@scraper

            echo "Waiting for startup..."
            sleep 10

            echo "Health check..."
            curl --fail https://robertstaff.com/api/v1/health

            echo "Deployment successful."
