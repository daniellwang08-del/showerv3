# Redis + Postgres for the VPS (and local Docker). Bind to loopback only —
# nginx (or Vite) is the public entrypoint; do not expose DB/Redis on the WAN.
#
#   docker compose --profile docker-db up -d
#
# POSTGRES_* in .env must match DATABASE_URL.
services:
  redis:
    image: redis:7-alpine
    container_name: showerv3-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: showerv3-postgres
    profiles:
      - docker-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_scraper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Optional UI for inspecting queues / keys (http://127.0.0.1:5540)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: showerv3-redis-insight
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - tools

volumes:
  redis_data:
  postgres_data:
  redis_insight_data:
