# TLS-safe hardening drop-in for NAO.
#
# Install as /etc/nginx/conf.d/nao-hardening.conf (loaded at the http{}
# level). The deploy workflow copies this file and reloads nginx.
#
# Why a drop-in instead of editing the site vhost: the vhost is certbot-managed
# (certbot rewrites it in place to add the listen 443 / ssl_certificate block).
# Overwriting that file would destroy TLS. Directives here live at http{} scope
# and are inherited by the vhost's server/location blocks, so security headers
# apply site-wide without touching the certbot-managed file.
#
# NOTE ON INHERITANCE: add_header is inherited only if the inner block defines
# no add_header of its own. The NAO vhost defines none, so these apply.

# Security headers (sent on every response, including the SPA shell).
# HSTS only affects HTTPS responses; browsers ignore it over plain HTTP.
add_header X-Content-Type-Options   "nosniff"                              always;
add_header X-Frame-Options          "SAMEORIGIN"                           always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"      always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
# Content-Security-Policy is intentionally omitted: a wrong CSP silently breaks
# the SPA. Add after auditing inline scripts/styles, e.g.:
#   add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

# Brute-force throttle zone for the auth endpoints (backs the app-level limiter).
# Referenced by `limit_req zone=nao_auth ...` in the site vhost's
# /api/v1/auth/ location. Defined here (http scope) so it survives certbot
# vhost rewrites and is never declared twice.
limit_req_zone $binary_remote_addr zone=nao_auth:10m rate=10r/s;
