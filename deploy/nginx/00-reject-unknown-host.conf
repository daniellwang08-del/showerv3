# Catch-all: refuse requests whose Host is not one of our own hostnames.
#
# Install on the VPS as /etc/nginx/sites-available/00-reject-unknown-host and
# symlink into sites-enabled.
#
# Without a default server, nginx falls back to the first block it parses, which
# would make the production site answer for any domain still pointed at this
# box (retired domains, scanners probing by bare IP). Name-based blocks always
# win over the default server, so atomspace.it.com is unaffected.
#
# 444 closes the connection without a response. On 443 a certificate is still
# required to complete the handshake before nginx can close it, so the
# production certificate is reused here; clients reaching this block get a name
# mismatch, which is the correct signal for a host we do not serve.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate /etc/letsencrypt/live/atomspace.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atomspace.it.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
