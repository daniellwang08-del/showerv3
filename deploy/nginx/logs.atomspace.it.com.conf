# Logs dashboard: logs.atomspace.it.com
#
# Same SPA + API proxy pattern as atomspace.it.com. Admin UI entry redirects to
# /system-logs. Install as /etc/nginx/sites-available/logs.atomspace and symlink
# into sites-enabled (deploy.yaml does this when the file is present).
#
# After DNS points here, issue TLS once:
#
#   certbot --nginx -d logs.atomspace.it.com --redirect
#
# This file intentionally stops at port 80 so certbot can append the TLS block.

server {
    listen 80;
    server_name logs.atomspace.it.com;

    root /opt/showerv3/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=atomspace_auth burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
