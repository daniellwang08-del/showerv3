# Production site: atomspace.it.com
#
# Install on the VPS as /etc/nginx/sites-available/atomspace and symlink into
# sites-enabled. SPA and API are same-origin: nginx serves the Vite build from
# frontend/dist and proxies /api/ to the FastAPI process on 127.0.0.1:8000.
#
# TLS is managed by certbot's nginx plugin, matching the convention already used
# by the other sites on this box:
#
#   certbot --nginx -d atomspace.it.com -d www.atomspace.it.com --redirect
#
# That command appends the `listen 443 ssl` block plus the HTTP->HTTPS redirect,
# so this file intentionally stops at port 80. Certbot requires the domain to
# already resolve to this server (HTTP-01 challenge).

# Security headers and the `atomspace_auth` limit_req_zone are defined in the
# http-scope drop-in deploy/nginx/conf.d/atomspace-hardening.conf (installed to
# /etc/nginx/conf.d/). They are kept there — not inline here — so certbot's
# in-place rewrite of this vhost cannot drop them and the zone is never declared
# twice. The auth location below references that zone.

server {
    listen 80;
    server_name atomspace.it.com www.atomspace.it.com;

    root /opt/showerv3/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    #
    # API (also carries the websocket upgrade for /api/v1/ws)
    #
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #
    # Auth endpoints: extra edge rate limit (login/signup/logout).
    # burst=20 nodelay absorbs normal bursts; sustained abuse gets 503.
    #
    location /api/v1/auth/ {
        limit_req zone=atomspace_auth burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #
    # Static assets generated by Vite (content-hashed filenames)
    #
    location /assets/ {
        try_files $uri =404;

        expires 365d;

        access_log off;

        add_header Cache-Control "public, immutable";
    }

    #
    # React SPA: every unknown path falls through to index.html so client
    # routes such as /login, /signup and /scraper survive a hard reload.
    #
    location / {
        try_files $uri /index.html;
    }
}
