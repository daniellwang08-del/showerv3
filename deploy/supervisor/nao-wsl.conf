; NAO WSL2 laptop stack: API + 8 arq workers + Vite under a user-level supervisord.
; Launched by scripts/wsl-stack.sh, which exports NAO_ROOT (repo root) and
; NAO_RUN_DIR (socket/pid dir on the Linux filesystem; AF_UNIX sockets do not
; work on /mnt/<drive>). Do not start supervisord with this file directly.
;
; Every program goes through `wsl-stack.sh run`, which cds to the repo, loads
; .env.wsl, puts .venv/bin first on PATH and execs the command, so editing
; .env.wsl takes effect on `wsl-stack.sh restart <name>`.
;
; Repo path must not contain spaces (supervisor splits `command` on whitespace).

[unix_http_server]
file=%(ENV_NAO_RUN_DIR)s/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_NAO_ROOT)s/.run/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=%(ENV_NAO_RUN_DIR)s/supervisord.pid
childlogdir=%(ENV_NAO_ROOT)s/.run/logs
directory=%(ENV_NAO_ROOT)s
nodaemon=false
minfds=4096
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_NAO_RUN_DIR)s/supervisor.sock

; ---------------------------------------------------------------------------
; API
; ---------------------------------------------------------------------------
[program:api]
command=/bin/bash %(ENV_NAO_ROOT)s/scripts/wsl-stack.sh run python start_server.py
priority=100
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_NAO_ROOT)s/.run/logs/%(program_name)s.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

; ---------------------------------------------------------------------------
; Workers (python run_worker.py <mode>)
; extraction + scraper own Chromium / spider subprocesses: long graceful stop,
; and signal only the worker first (stopasgroup=false) so it can close the
; browser pool itself; the group is killed if it overruns stopwaitsecs.
; Never run a second extraction or scraper program.
; ---------------------------------------------------------------------------
[program:extraction]
command=/bin/bash %(ENV_NAO_ROOT)s/scripts/wsl-stack.sh run python run_worker.py extraction
priority=200
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=90
stopasgroup=false
killasgroup=true
stdout_logfile=%(ENV_NAO_ROOT)s/.run/logs/%(program_name)s.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

